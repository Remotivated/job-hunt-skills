name: Checks

on:
  push:
  pull_request:

jobs:
  vendor-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Verify checked-in vendor bundle is up to date with the lockfile
        run: |
          npm run build:vendor
          git diff --exit-code scripts/vendor

  content-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned so a breaking Typst release fails loudly here, not on a
      # user's machine. Keep in sync with MIN_TYPST_VERSION in
      # scripts/export-documents.mjs (this must be >= that floor).
      - name: Install Typst (pinned)
        run: |
          TYPST_VERSION=v0.15.1
          curl -fsSL "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      # Contributor-side check scripts only — nothing here runs on a user
      # machine (markdown-it-py is needed by check-internal-links.py).
      - name: Install Python dependencies for check scripts
        run: python -m pip install markdown-it-py

      - name: Run content hygiene
        run: python scripts/check-content-hygiene.py

      - name: Check internal links
        run: python scripts/check-internal-links.py

      # No npm ci here on purpose: the export tests must pass against the
      # checked-in vendor bundle alone, exactly like a user machine.
      - name: Run export tests (Tier 2 + Tier 3)
        run: |
          typst --version
          npm run test:export

      # Pure Node, no dependencies — same as a user machine.
      - name: Run profile-strength tests
        run: npm run test:strength

      - name: Run Codex plugin contract tests
        run: npm run test:codex

      - name: Run skill contract tests
        run: python scripts/test_skill_contracts.py
