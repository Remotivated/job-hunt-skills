name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The full check suite on every OS, the same workflow pull requests run.
  checks:
    uses: ./.github/workflows/checks.yml

  # Publishes the Cowork ZIP only after every check passed. This is the only
  # job that can write to the repository.
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build dual-compatible plugin ZIP
        run: node scripts/build-cowork-zip.mjs

      - name: Verify plugin manifests in archive
        run: |
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- ".claude-plugin/plugin.json"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- ".codex-plugin/plugin.json"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "LICENSE"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "README.md"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- ".agents/plugins/marketplace.json"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "scripts/vendor/LICENSES.md"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "scripts/vendor/LEGAL.txt"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "scripts/vendor/SOURCE-NOTICES.md"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "scripts/vendor/vendor-inputs.json"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "templates/fonts/OFL.txt"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "skills/get-started/agents/openai.yaml"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "skills/_shared/truth-and-content.md"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "skills/get-started/references/state-layer.md"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "skills/get-started/references/truth-and-content.md"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "scripts/state.mjs"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "scripts/workspace.mjs"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "scripts/opportunity.mjs"
          unzip -Z1 dist/job-hunt-skills.zip | grep -Fx -- "skills/opportunity-evaluator/SKILL.md"
          if unzip -Z1 dist/job-hunt-skills.zip | grep -E '^(plugins|examples|prompts|assets|\.github)/'; then
            echo "repository-only files leaked into the plugin ZIP" >&2
            exit 1
          fi

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/job-hunt-skills.zip
          generate_release_notes: true
